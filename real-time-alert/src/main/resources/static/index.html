<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HydroWatch Real-Time Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #1a365d; margin: 0; }
        .header p { color: #4a5568; margin-top: 5px; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); text-align: center; border-top: 4px solid #3182ce; }
        .card h3 { margin: 0; color: #718096; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 2.2em; font-weight: bold; color: #2b6cb0; margin-top: 10px; }

        .alert-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border-left: 6px solid #e53e3e; }
        .alert-container h3 { margin-top: 0; color: #c53030; font-size: 1.1em; display: flex; align-items: center; gap: 8px; }
        #alertsList { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        #alertsList li { padding: 10px 12px; border-bottom: 1px solid #edf2f7; color: #2d3748; font-family: monospace; font-size: 0.95em; }
        #alertsList li:first-child { background-color: #fff5f5; font-weight: bold; color: #9b2c2c; }

        .chat-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border-left: 6px solid #3182ce; margin-top: 30px; }
        .chat-container h3 { margin-top: 0; color: #2b6cb0; font-size: 1.1em; }
        #chatLog { height: 260px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; background: #f7fafc; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
        .msg.user { background: #3182ce; color: white; margin-left: auto; }
        .msg.bot { background: white; border: 1px solid #e2e8f0; color: #2d3748; }
        .msg.error { background: #fff5f5; border: 1px solid #feb2b2; color: #9b2c2c; }
        .msg.thinking { color: #a0aec0; font-style: italic; }
        .chat-input-row { display: flex; gap: 8px; }
        #chatInput { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1em; font-family: inherit; }
        #chatSend { padding: 10px 20px; background: #3182ce; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; }
        #chatSend:disabled { background: #a0aec0; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>HydroWatch Monitoring System</h1>
        <p>Live CSV Stream & Anomaly Detection</p>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h3>Temperature</h3>
            <div class="value" id="tempValue">-- °C</div>
        </div>
        <div class="card">
            <h3>pH Level</h3>
            <div class="value" id="phValue">--</div>
        </div>
        <div class="card">
            <h3>Dissolved Oxygen</h3>
            <div class="value" id="doValue">-- mg/L</div>
        </div>
    </div>

    <div class="alert-container">
        <h3>⚠️ Real-Time Anomaly Alerts</h3>
        <ul id="alertsList">
            <li style="color: #a0aec0; font-weight: normal;">Waiting for system updates...</li>
        </ul>
    </div>

    <div class="chat-container">
        <h3>💬 HydroWatch AI Assistant</h3>
        <div id="chatLog">
            <div class="msg bot">Hi! Ask me anything about water quality, based on the HydroWatch documents.</div>
        </div>
        <div class="chat-input-row">
            <input id="chatInput" type="text" placeholder="e.g. What is a safe pH range for drinking water?" autocomplete="off">
            <button id="chatSend">Send</button>
        </div>
    </div>
</div>

<script>
    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function (frame) {
        console.log('Connected to WebSocket');
        document.getElementById('alertsList').innerHTML = '';

        // Update live dashboard card values
        stompClient.subscribe('/topic/sensor-data', function (message) {
            var data = JSON.parse(message.body);
            if (data.type === 'TEMPERATURE') {
                document.getElementById('tempValue').innerText = data.value + ' °C';
            } else if (data.type === 'PH') {
                document.getElementById('phValue').innerText = data.value;
            } else if (data.type === 'OXYGEN') {
                document.getElementById('doValue').innerText = data.value + ' mg/L';
            }
        });

        // Append live anomaly alerts to feed
        stompClient.subscribe('/topic/anomalies', function (message) {
            var ul = document.getElementById("alertsList");
            var li = document.createElement("li");
            li.appendChild(document.createTextNode(message.body));
            ul.insertBefore(li, ul.firstChild);
        });
    });

    // ---------- Chatbot ----------
    var chatLog = document.getElementById('chatLog');
    var chatInput = document.getElementById('chatInput');
    var chatSend = document.getElementById('chatSend');

    function addChatMessage(text, cssClass) {
        var div = document.createElement('div');
        div.className = 'msg ' + cssClass;
        div.textContent = text;           // textContent avoids HTML injection
        chatLog.appendChild(div);
        chatLog.scrollTop = chatLog.scrollHeight;
        return div;
    }

    async function sendChat() {
        var question = chatInput.value.trim();
        if (!question) return;

        addChatMessage(question, 'user');
        chatInput.value = '';
        chatSend.disabled = true;
        var thinking = addChatMessage('Thinking...', 'thinking');

        try {
            var res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });
            var text = await res.text();
            thinking.remove();
            addChatMessage(text, res.ok ? 'bot' : 'error');
        } catch (e) {
            thinking.remove();
            addChatMessage('Could not reach the chatbot: ' + e.message, 'error');
        } finally {
            chatSend.disabled = false;
            chatInput.focus();
        }
    }

    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
