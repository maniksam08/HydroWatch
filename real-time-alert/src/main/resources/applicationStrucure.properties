spring.application.name=real-time-alert

server.port=PORT_NUMBER
websocket.allowed-origins=

spring.data.redis.host=REDIS_HOST
spring.data.redis.port=REDIS_PORT

spring.ai.model.chat=CHAT_MODEL_PROVIDER
spring.ai.model.embedding.text=EMBEDDING_MODEL_PROVIDER
spring.ai.google.genai.api-key=API_KEY
spring.ai.google.genai.chat.options.model=CHAT_MODEL

spring.ai.google.genai.embedding.api-key=API_KEY
spring.ai.google.genai.embedding.text.model=EMBEDDING_MODEL